version: 2

# Target-state raw layer: models read from the new data_* datasets.
# The former single `warehouse` source (which fed BOTH life tables and
# personal-finance tables) is split into `life` (-> data_life) and
# `finance_personal` (-> data_finance_personal). Website tables move to
# `website` (-> data_website). Business finance -> data_finance_business.
#
# Source freshness (Supabase sync safety net)
# ----------------------------------------------------
# personal-sync.mjs (goatmark/jarvis, GitHub Actions) runs 3x daily at
# 09:00, 17:00, 23:00 UTC and stamps `synced_at` (full reload via
# WRITE_TRUNCATE, so max(synced_at) == last successful sync time).
# website-sync.mjs syncs data_website tables on the same cadence.
# mercury_transactions has no `synced_at`; it uses its own
# purpose-built `loaded_at` TIMESTAMP instead.
# freshness thresholds: warn after 12h, error after 30h.
# NOT added to intentionally-static lookup tables (categories, subcategories)
# nor to tables that are static-in-practice / not currently resynced
# (exercise_muscles, exercise_loads, blog_posts) — those would false-alarm.
sources:
  - name: life
    database: data-warehouse-475122
    schema: data_life
    tables:
      - name: exercises
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      # exercise_log / recipe_log / shopping_log / weights: rolling activity logs
      - name: exercise_log
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      # exercise_muscles / exercise_loads: synced via GHA personal-sync (3x daily).
      # Previously stale (Airbyte era, last 2026-04-29) because RLS blocked the anon
      # key. Fixed 2026-09-29: SUPABASE_KEY GHA secret switched to service role key.
      - name: exercise_muscles
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: exercise_loads
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: recipe_log
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: recipes
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: shopping_log
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: weights
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      # ingredients_clean / ingredient_amounts: ported from the retired
      # run_personal_models.py legacy script (2026-07-06) — no freshness
      # config yet, unverified sync cadence.
      - name: ingredients_clean
      - name: ingredient_amounts

  - name: finance_personal
    database: data-warehouse-475122
    schema: data_finance_personal
    tables:
      # card_transactions: the Tiller -> Sheet -> Supabase -> BQ path.
      # This is the highest-priority freshness check (silent stall risk).
      - name: card_transactions
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: merchants
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: transaction_merchant_maps
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      # subcategories / categories: intentionally-static lookups — no freshness
      - name: subcategories
      - name: categories

  - name: website
    database: data-warehouse-475122
    schema: data_website
    tables:
      - name: notion_embeddings
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      # blog_posts: static-in-practice (last synced 2026-02-06) — no freshness
      - name: blog_posts
      - name: email_settings
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: priorities
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: users
        config:
          loaded_at_field: synced_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}

  - name: finance
    database: data-warehouse-475122
    schema: data_finance_business
    tables:
      # mercury_transactions has no synced_at; use its own load stamp.
      - name: mercury_transactions
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 30, period: hour}
      - name: notion_transactions
